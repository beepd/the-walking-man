<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Walking Man</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="scene">
    <!-- The whole picture is one SVG. Its own coordinate system is 400 wide x 300 tall. -->
    <svg id="scene" viewBox="-200 0 800 300" xmlns="http://www.w3.org/2000/svg" aria-label="A traveller walking between two cities">

      <!-- The city he left (left) and the city he is walking to (right).
           app.js fills these in. The art is drawn in a 160 x 170 box, so these
           translate() values place each box with its bottom edge on the ground. -->
      <g transform="translate(-190 92)"><g id="cityLeft" class="city-art"></g></g>
      <g transform="translate(430 92)"><g id="cityRight" class="city-art"></g></g>
      <text id="labelLeft"  class="city-label" x="-110" y="288"></text>
      <text id="labelRight" class="city-label" x="510"  y="288"></text>

      <!-- The ground: a dashed line that slides left, so the man looks like he moves right -->
      <line class="ground" x1="-200" y1="262" x2="600" y2="262"/>

      <!-- The man. 'bob' makes the whole body rise and fall slightly with each step -->
      <g class="man">
        <g class="bob">

          <!-- Far-side limbs first (they sit behind the body, in darker shades) -->
          <g class="arm arm-b">
            <line class="sleeve" x1="200" y1="108" x2="200" y2="140"/>
            <g class="forearm">
              <line class="skin-limb" x1="200" y1="140" x2="200" y2="166"/>
              <circle class="skin" cx="200" cy="168" r="5.5"/>
            </g>
          </g>
          <g class="leg leg-b">
            <line class="pant" x1="200" y1="160" x2="200" y2="210"/>
            <g class="shin">
              <line class="pant" x1="200" y1="210" x2="200" y2="255"/>
              <ellipse class="shoe" cx="207" cy="257" rx="13" ry="6.5"/>
            </g>
          </g>

          <!-- Backpack, then the tunic -->
          <rect class="pack" x="171" y="110" width="26" height="42" rx="10"/>
          <path class="tunic" d="M187 106 Q200 99 213 106 L217 170 Q200 176 183 170 Z"/>
          <line class="strap" x1="197" y1="107" x2="194" y2="146"/>

          <!-- Scarf: a ring round the neck and a tail that flutters behind -->
          <g class="scarf-tail">
            <path class="scarf-line" d="M192 106 Q176 106 160 120"/>
          </g>
          <path class="scarf-line" d="M188 104 Q200 111 212 104"/>

          <!-- Head: face, then straw hat on top -->
          <circle class="skin" cx="200" cy="82" r="17"/>
          <circle class="eye" cx="208" cy="81" r="2.4"/>
          <path class="smile" d="M205 89 Q210 94 215 88"/>
          <g transform="translate(0 -7)">
          <path class="hat" d="M183 77 Q200 48 217 77 Z"/>
          <path class="hat-band" d="M184 74 Q200 80 216 74"/>
          <ellipse class="hat" cx="200" cy="77" rx="28" ry="5.5"/>
          </g>

          <!-- Near-side limbs -->
          <g class="leg leg-a">
            <line class="pant" x1="200" y1="160" x2="200" y2="210"/>
            <g class="shin">
              <line class="pant" x1="200" y1="210" x2="200" y2="255"/>
              <ellipse class="shoe" cx="207" cy="257" rx="13" ry="6.5"/>
            </g>
          </g>
          <g class="arm arm-a">
            <line class="sleeve" x1="200" y1="108" x2="200" y2="140"/>
            <g class="forearm">
              <line class="skin-limb" x1="200" y1="140" x2="200" y2="166"/>
              <circle class="skin" cx="200" cy="168" r="5.5"/>
              <!-- olive sprig held in the hand -->
              <path class="sprig" d="M200 166 Q204 156 202 144"/>
              <ellipse class="leaf" cx="197" cy="154" rx="3" ry="6" transform="rotate(-35 197 154)"/>
              <ellipse class="leaf" cx="206" cy="150" rx="3" ry="6" transform="rotate(35 206 150)"/>
              <ellipse class="leaf" cx="201" cy="141" rx="3" ry="6"/>
            </g>
          </g>

        </g>
      </g>
    </svg>

    <div class="controls">
      <button id="toggle" type="button">Pause</button>
      <button id="sound" type="button">Sound: on</button>
    </div>
  </main>

  <!-- Start screen: browsers only allow sound after a tap, so we ask for one -->
  <div id="start" class="overlay">
    <h1>The Walking Man</h1>
    <p>Walking for world peace</p>
    <button id="startBtn" type="button">Tap to start walking</button>
    <p class="hint">Best with sound on</p>
  </div>

  <!-- Shown only on a phone held upright -->
  <div id="rotate" class="rotate-hint">
    <p>Rotate your phone to walk with him</p>
  </div>

  <script src="cities.js"></script>
  <script src="app.js"></script>

</body>
</html>
