<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Walking Man</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="started">

  <!-- The numbers along the top. app.js fills them in every second. -->
  <div class="hud">
    <div class="hud-item hud-left">
      <span class="hud-label">On the road</span>
      <span id="hudElapsed" class="hud-value">-</span>
    </div>
    <div class="hud-item hud-center">
      <span id="hudNextLabel" class="hud-label">Next stop</span>
      <span id="hudCountdown" class="hud-big">-</span>
      <span id="hudStatus" class="hud-small"></span>
    </div>
    <div class="hud-item hud-right">
      <span class="hud-label">Distance travelled</span>
      <span id="hudKm" class="hud-value">-</span>
      <span id="hudClock" class="hud-small"></span>
    </div>
  </div>

  <main class="scene">
    <!-- The whole picture is one SVG. Its own coordinate system is 800 wide x 300 tall. -->
    <svg id="scene" viewBox="-200 0 800 300" xmlns="http://www.w3.org/2000/svg" aria-label="A traveller walking between two cities">

      <defs>
        <linearGradient id="t-skin"  x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFC17D"/><stop offset="1" stop-color="#F59A51"/></linearGradient>
        <linearGradient id="t-shirt" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#87965A"/><stop offset="1" stop-color="#596C3D"/></linearGradient>
        <linearGradient id="t-pack"  x1="0" y1="0" x2="1" y2="1"><stop stop-color="#294765"/><stop offset="1" stop-color="#142B45"/></linearGradient>
      </defs>

      <!-- The city he left (left) and the city he is walking to (right).
           app.js fills these in. The art is drawn in a 160 x 170 box, so these
           translate() values place each box with its bottom edge on the ground. -->
      <g id="cityLeft"></g>
      <g id="localsLeft"></g>
      <g id="cityRight"></g>
      <g id="localsRight"></g>

      <!-- Sky objects. The sun and moon travel across the middle, between the two cities. -->
      <g id="sky">
        <g id="stars"></g>
        <g id="sun" opacity="0">
          <circle r="30" fill="#ffd35c" opacity="0.18"/>
          <circle r="21" fill="#ffd35c" opacity="0.30"/>
          <circle r="14" fill="#ffd966"/>
        </g>
        <g id="moon" opacity="0">
          <circle r="19" fill="#f4f1e1" opacity="0.14"/>
          <circle r="13" fill="#f4f1e1"/>
          <circle cx="-4" cy="-3" r="2.6" fill="#dcd8c4"/>
          <circle cx="4" cy="3" r="3.2" fill="#dcd8c4"/>
          <circle cx="3" cy="-6" r="1.6" fill="#dcd8c4"/>
        </g>
      </g>


      <!-- The sea, used on the legs he rows. The back wave sits behind the boat. -->
      <g id="sea">
        <g class="wave wave-back"><path class="sea-back" d="M-2400 265 q20 -10 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 V3000 H-2400 Z"/></g>
      </g>

      <!-- The ground: a dashed line that slides left, so the man looks like he moves right -->
      <line class="ground" x1="-200" y1="262" x2="600" y2="262"/>

      <!-- Everything that sits on the water rocks together, so it all lives in one group.
           The boat points right (the way he travels). He sits facing the stern, like a real rower. -->
      <g id="rock">

        <!-- inside of the boat, far side, and the bench he sits on -->
        <g id="boatBack">
          <path d="M110 234 L298 222 L296 227 L112 241 Z" fill="#3e2815"/>
          <rect x="196" y="232" width="48" height="6" rx="2" fill="#8a5a2b"/>
        </g>

        <!-- far oar, behind him -->
        <g id="oarFar" class="oar">
          <line class="oar-shaft" x1="196" y1="192" x2="196" y2="298"/>
          <path class="oar-blade" d="M190 274 L202 274 L204 304 L188 304 Z"/>
        </g>

      <!-- The man. Soft shadow first, then the traveller.
           'bob' makes the whole body rise and fall with each step.
           The drawing is in its own 1200 x 900 space, so the group below scales it down and
           sets his feet on the ground line. Each moving part (legs, shoes, front arm) is its own
           group, so the CSS can swing it around its joint. -->
      <ellipse class="shadow" cx="212" cy="263" rx="50" ry="5"/>
      <g class="man">
        <g class="bob">
          <g transform="translate(47 41) scale(0.255)">

            <!-- backpack, behind everything (its own group so it can lean with the body when rowing) -->
            <g class="t-pack">
            <path d="M425 262 Q425 218 464 203 L535 190 Q570 195 583 231 L601 390 Q604 438 569 459 L467 475 Q434 464 431 427 Z" fill="url(#t-pack)" stroke="#142B45" stroke-width="5"/>
            <path d="M446 255 Q451 224 479 218 L526 210 Q548 214 554 242 L559 275 L441 294 Z" fill="#D76D32"/>
            <path d="M438 300 Q492 273 563 293 L574 370 Q514 395 440 376 Z" fill="#203B59"/>
            <path d="M446 386 Q502 400 574 380 L579 422 Q576 445 552 451 L467 462 Q446 455 444 433 Z" fill="#1B344F"/>
            <path d="M456 278 L477 283 L468 338 L449 332 Z M535 273 L555 269 L561 322 L542 328 Z" fill="#E57C3B"/>
            <path d="M458 410 Q489 423 548 408" fill="none" stroke="#3A5672" stroke-width="5" stroke-linecap="round"/>
            <path d="M475 205 Q493 183 519 196 L539 211" fill="none" stroke="#D8793D" stroke-width="8" stroke-linecap="round"/>
            </g>

            <!-- far leg: the leg swings from the hip, the shoe turns at the ankle -->
            <g class="t-leg t-leg-far">
            <path d="M548 548 Q526 610 489 666 L424 756 Q409 778 431 793 L466 803 Q485 802 498 781 L582 694 Q615 655 627 606 L634 563 Z" fill="#28516D" stroke="#1D405A" stroke-width="5"/>
              <g class="t-shoe t-shoe-far">
            <path d="M432 750 L478 776 L463 805 L420 790 Q404 779 417 760 Z" fill="#91B9C8"/>
            <path d="M419 779 Q441 782 464 798 L453 824 L416 815 Q395 806 402 793 Z" fill="#F2A45F"/>
            <path d="M409 803 Q432 812 451 823 L475 837 Q494 850 477 860 L409 861 Q384 856 389 837 L398 813 Z" fill="#5B392A" stroke="#3E2B24" stroke-width="5"/>
            <path d="M390 844 Q427 855 478 844 Q488 853 476 863 L405 867 Q386 864 390 844 Z" fill="#F3E5CF"/>
            <path d="M419 824 L445 840 M428 820 L453 836 M438 818 L462 831" stroke="#D9C4A7" stroke-width="5" stroke-linecap="round"/>
              </g>
            </g>

            <!-- near leg -->
            <g class="t-leg t-leg-near">
            <path d="M601 541 Q634 601 664 657 L723 756 Q737 779 716 793 L682 809 Q664 812 651 789 L579 693 Q550 654 538 611 L535 555 Z" fill="#315E7A" stroke="#1D405A" stroke-width="5"/>
              <g class="t-shoe t-shoe-near">
            <path d="M683 748 L725 733 L741 769 L700 793 Z" fill="#91B9C8"/>
            <path d="M697 784 Q716 773 737 765 L755 791 L724 815 Q705 821 697 803 Z" fill="#F2A45F"/>
            <path d="M717 803 Q737 803 758 790 L784 787 Q804 789 813 806 L826 829 Q833 847 810 855 L742 867 Q719 868 710 850 L706 829 Z" fill="#6B422F" stroke="#3E2B24" stroke-width="5"/>
            <path d="M712 845 Q755 851 815 829 Q832 842 815 856 L746 871 Q721 872 712 857 Z" fill="#F3E5CF"/>
            <path d="M752 812 L774 831 M766 808 L787 827 M780 806 L799 821" stroke="#E4D0B4" stroke-width="5" stroke-linecap="round"/>
              </g>
            </g>

            <!-- everything above the hips in one group, so the body can lean forward and back when rowing -->
            <g class="t-upper">
            <!-- free arm, swinging, with the watch: behind the torso, so it reads as the arm on the far side -->
            <g class="t-arm t-arm-back">
            <path d="M630 292 Q652 300 663 322 L686 370 Q699 393 714 413 L741 444 Q752 459 740 472 Q728 484 713 469 L674 438 Q656 423 642 401 L612 354 Q599 329 610 309 Z" fill="url(#t-skin)"/>
            <path d="M690 413 Q707 429 723 446 L742 447 Q753 457 740 472 Q728 484 713 469 L682 443 Z" fill="#F6A15C"/>
            <path d="M672 402 L691 390 L706 410 L688 424 Z" fill="#17283A"/>
            <rect x="678" y="397" width="18" height="15" rx="4" transform="rotate(-32 687 404)" fill="#263C51"/>
            </g>

            <!-- torso, shirt, far arm holding the backpack strap -->
            <path d="M536 239 Q567 218 601 234 L650 263 Q671 284 664 322 L643 405 L651 516 Q618 543 560 531 L526 516 L516 410 L501 314 Q500 270 536 239 Z" fill="url(#t-shirt)" stroke="#4D6037" stroke-width="5"/>
            <path d="M563 246 L610 250 L620 506 Q593 516 570 505 L558 321 Z" fill="#F7F1E5"/>
            <path d="M535 314 Q559 333 559 361 L549 414 M625 333 L644 378 L629 405 M552 470 L579 488" fill="none" stroke="#4E6239" stroke-width="8" stroke-linecap="round" opacity=".75"/>
            <path d="M532 273 Q506 279 492 311 L479 356 Q472 379 492 390 Q511 397 524 376 L549 330 Z" fill="url(#t-skin)"/>
            <path d="M481 355 Q474 375 491 388 Q506 395 518 378 L528 360 L505 344 Z" fill="#F6A15C"/>

            <!-- the same arm drawn in front of the body, shown only while he eats (his hand goes to his mouth) -->
            <g class="t-arm t-arm-front">
            <path d="M630 292 Q652 300 663 322 L686 370 Q699 393 714 413 L741 444 Q752 459 740 472 Q728 484 713 469 L674 438 Q656 423 642 401 L612 354 Q599 329 610 309 Z" fill="url(#t-skin)"/>
            <path d="M690 413 Q707 429 723 446 L742 447 Q753 457 740 472 Q728 484 713 469 L682 443 Z" fill="#F6A15C"/>
            <path d="M672 402 L691 390 L706 410 L688 424 Z" fill="#17283A"/>
            <rect x="678" y="397" width="18" height="15" rx="4" transform="rotate(-32 687 404)" fill="#263C51"/>
            </g>

            <!-- shoulder strap and the hand gripping it -->
            <path d="M531 238 Q558 223 581 243 L607 284 L588 302 L560 263 Q550 255 539 266 Z" fill="#1B344F" stroke="#10263D" stroke-width="4"/>
            <path d="M566 250 L582 244 L610 286 L594 298 Z" fill="#D97837"/>
            <path d="M558 288 Q571 280 581 291 L596 310 Q603 319 594 327 L581 337 Q571 342 565 333 L551 315 Q546 301 558 288 Z" fill="url(#t-skin)"/>
            <path d="M571 300 L584 313 M566 308 L579 321" fill="none" stroke="#E88748" stroke-width="4" stroke-linecap="round"/>

            <!-- neck, head, ear, hair, face, collar -->
            <path d="M573 190 L577 235 Q591 254 613 241 L618 210 Z" fill="url(#t-skin)"/>
            <path d="M548 123 Q548 83 584 69 Q621 56 650 79 Q675 99 671 133 L666 166 Q659 194 633 207 Q606 220 582 201 L562 181 Q548 164 548 123 Z" fill="url(#t-skin)" stroke="#E88748" stroke-width="3"/>
            <ellipse cx="558" cy="151" rx="17" ry="22" fill="#F6A15C"/>
            <path d="M553 148 Q563 141 564 153 Q560 162 554 157" fill="none" stroke="#D8793D" stroke-width="3"/>
            <path d="M543 151 Q524 128 536 98 Q543 76 568 65 Q585 45 614 55 Q634 36 652 52 Q672 59 672 79 Q697 77 699 96 Q695 116 673 120 L661 101 Q641 119 612 112 Q590 130 574 130 L568 166 Q555 168 543 151 Z" fill="#302322"/>
            <path d="M548 103 Q570 76 592 79 Q613 79 627 62 M612 83 Q638 73 652 59 M649 99 Q668 95 679 84" fill="none" stroke="#49302A" stroke-width="6" stroke-linecap="round"/>
            <path d="M632 129 Q644 124 652 129" fill="none" stroke="#382521" stroke-width="5" stroke-linecap="round"/>
            <ellipse cx="644" cy="143" rx="4" ry="7" fill="#2A211E"/>
            <path d="M661 158 Q671 162 680 157" fill="none" stroke="#C96E42" stroke-width="4" stroke-linecap="round"/>
            <path d="M627 183 Q644 192 661 180" fill="none" stroke="#D8794D" stroke-width="3" stroke-linecap="round"/>
            <path d="M565 237 L584 254 L570 274 L552 249 Z" fill="#6B7D49"/>
            <path d="M605 240 L620 251 L613 274 L594 252 Z" fill="#657744"/>

            </g>
          </g>
        </g>
      </g>

        <!-- the near side of the boat hangs in front of his legs, with the near oar on top -->
        <g id="boatFront">
          <path d="M106 238 L300 226 Q292 262 252 272 L142 272 Q112 266 106 238 Z" fill="#b5702f"/>
          <path d="M106 238 L300 226" fill="none" stroke="#7a4a1f" stroke-width="4" stroke-linecap="round"/>
          <path d="M112 251 L292 241" fill="none" stroke="#f4ead2" stroke-width="3" stroke-linecap="round"/>
          <circle cx="184" cy="233" r="3.4" fill="#4a3a2a"/>
        </g>
        <g id="oarNear" class="oar">
          <line class="oar-shaft" x1="184" y1="192" x2="184" y2="296"/>
          <path class="oar-blade" d="M178 272 L190 272 L192 302 L176 302 Z"/>
          <circle class="oar-grip" cx="184" cy="192" r="3.6"/>
        </g>

      <!-- Where he sleeps: a tent with a glowing doorway, his shoes outside, and a little flag.
           It fades in when he goes to sleep and the man fades out. -->
      <g id="tent">
        <ellipse cx="205" cy="263" rx="86" ry="6" fill="rgba(0,0,0,0.18)"/>
        <path d="M205 140 V154" stroke="#6b4a2a" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M205 140 L224 146 L205 152 Z" fill="#f7f3ea"/>
        <path d="M118 262 L205 152 L292 262 Z" fill="#d9822b"/>
        <path d="M205 152 L292 262 L236 262 Z" fill="#b86a1e"/>
        <path d="M205 186 L178 262 L232 262 Z" fill="#2a1a12"/>
        <path class="tent-glow" d="M205 196 L186 262 L224 262 Z" fill="#ffcf70" opacity="0.55"/>
        <ellipse cx="160" cy="260" rx="12" ry="5.5" fill="#6b422f"/>
        <ellipse cx="160" cy="263" rx="12" ry="2.6" fill="#f3e5cf"/>
        <ellipse cx="256" cy="260" rx="12" ry="5.5" fill="#6b422f"/>
        <ellipse cx="256" cy="263" rx="12" ry="2.6" fill="#f3e5cf"/>
        <g class="zzz" fill="currentColor">
          <text class="z z1" x="262" y="146">z</text>
          <text class="z z2" x="276" y="124">z</text>
          <text class="z z3" x="294" y="98">Z</text>
        </g>
      </g>

      <!-- The dish he is eating. app.js draws the city's dish here and shrinks it as he eats. -->
      <g id="food"><g id="foodArt"></g></g>

      </g><!-- end of rock -->

      <!-- The front wave hides the bottom of the boat and the oar blades, so they sit in the water -->
      <g id="seaFront">
        <g class="wave wave-front"><path class="sea-front" d="M-2400 267 q30 -8 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 V3000 H-2400 Z"/></g>
      </g>

      <text id="labelLeft"  class="city-label" x="-110" y="288"></text>
      <text id="labelRight" class="city-label" x="510"  y="288"></text>
    </svg>

    <div class="controls">
      <button id="sound" type="button">Tap for sound</button>
    </div>
  </main>

  <!-- Only shown in demo mode (?demo) -->
  <div id="demoNote" class="demo-note" hidden></div>

  <!-- Shown only on a phone held upright -->
  <div id="rotate" class="rotate-hint">
    <p>Rotate your phone to walk with him</p>
  </div>

  <script src="cities.js"></script>
  <script src="journey.js"></script>
  <script src="app.js"></script>

</body>
</html>
