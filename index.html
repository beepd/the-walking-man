<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Walking Man</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="scene">
    <!-- The whole picture is one SVG. Its own coordinate system is 400 wide x 300 tall. -->
    <svg id="scene" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" aria-label="A man walking">

      <!-- The ground: a dashed line that slides left, so the man looks like he moves right -->
      <line class="ground" x1="0" y1="262" x2="400" y2="262"/>

      <!-- The man. 'bob' makes the whole body rise and fall slightly with each step -->
      <g class="man">
        <g class="bob">

          <!-- Back-side limbs are drawn first (so they sit behind the body), in a lighter shade -->
          <g class="arm arm-b">
            <line x1="200" y1="105" x2="200" y2="140"/>
            <g class="forearm"><line x1="200" y1="140" x2="200" y2="168"/></g>
          </g>
          <g class="leg leg-b">
            <line x1="200" y1="160" x2="200" y2="210"/>
            <g class="shin">
              <line x1="200" y1="210" x2="200" y2="258"/>
              <line x1="200" y1="258" x2="214" y2="258"/>
            </g>
          </g>

          <!-- Torso and head -->
          <line class="torso" x1="200" y1="104" x2="200" y2="162"/>
          <circle class="head" cx="200" cy="82" r="17"/>

          <!-- Front-side limbs -->
          <g class="leg leg-a">
            <line x1="200" y1="160" x2="200" y2="210"/>
            <g class="shin">
              <line x1="200" y1="210" x2="200" y2="258"/>
              <line x1="200" y1="258" x2="214" y2="258"/>
            </g>
          </g>
          <g class="arm arm-a">
            <line x1="200" y1="105" x2="200" y2="140"/>
            <g class="forearm"><line x1="200" y1="140" x2="200" y2="168"/></g>
          </g>

        </g>
      </g>
    </svg>

    <button id="toggle" type="button">Pause</button>
  </main>

  <script>
    // Tiny script: the button adds/removes a CSS class on <body>.
    // The CSS does the rest (it freezes every animation when the class is present).
    const button = document.getElementById('toggle');
    button.addEventListener('click', () => {
      const paused = document.body.classList.toggle('paused');
      button.textContent = paused ? 'Walk' : 'Pause';
    });
  </script>

</body>
</html>
